
name: STRUCTPIN Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Run engineering tests
        run: |
          $env:PYTHONPATH = "src"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          python -m unittest discover -s tests -v

      - name: Build STRUCTPIN
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name STRUCTPIN `
            --paths src `
            src/structpin/__main__.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/STRUCTPIN.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: STRUCTPIN-Windows-Installer
          path: installer/output/STRUCTPIN-Setup.exe
          if-no-files-found: error
